version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: trino-postgres
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [trino-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: trino-mysql
    environment:
      MYSQL_DATABASE: sales_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      MYSQL_ROOT_PASSWORD: root123
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [trino-network]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: trino-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    command: server /data --console-address ":9001"
    networks: [trino-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie-catalog
    ports:
      - "19120:19120"
    environment:
      QUARKUS_HTTP_PORT: 19120
      QUARKUS_PROFILE: dev
    networks: [trino-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v1/config"]
      interval: 10s
      timeout: 5s
      retries: 10

  trino:
    image: trinodb/trino:423
    container_name: trino-coordinator
    ports: ["8080:8080"]
    volumes:
      - ./catalog:/etc/trino/catalog
    networks: [trino-network]
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      nessie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  trino-network:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
  minio_data: